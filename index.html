<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Интерактивные карточки</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <section class="banner">
        <h1>Интерактивный баннер</h1>
        <!-- Для поддержки навигации по Tab карточки/ссылки должны быть интерактивными элементами (href) -->
        <a href="#" class="banner__link">Подробнее</a>
    </section>

    <main class="cards">
        <!-- Обычные карточки (ссылки, чтобы работал focus-visible и Tab) -->
        <a href="#" class="card card--primary">
            <h2>Карточка 1</h2>
            <p>Основной тип карточки с декоративными элементами.</p>
        </a>
        
        <!-- Выделенная карточка (исключается через :not) -->
        <a href="#" class="card card--featured">
            <h2>Карточка 2</h2>
            <p>Выделенная карточка. На неё не действует эффект масштабирования при наведении.</p>
        </a>
        
        <!-- Вторая обычная карточка (другой вариант для :is) -->
        <a href="#" class="card card--secondary">
            <h2>Карточка 3</h2>
            <p>Второй вариант обычной карточки, объединенный с первым через :is().</p>
        </a>
    </main>

</body>
</html>
